[metadata]
name = decentralizepy
version = 0.1.dev0
author = Sayan Biswas, Antoine Boutet, Davide Frey, Romaric Gaudel, Rachid Guerraoui, Maxime Jacovella, Anne-Marie Kermarrec, Dimitri Lerévérend, François Taïani, Martijn de Vos
license = MIT
description = ARGUS: backdoor detection in decentralized learning, built on the DecentralizePy framework
keywords =
    python
    decentralized
    ml
    learning
url = https://arxiv.org/abs/2605.19969
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
        Development Status :: 4 - Beta
        Intended Audience :: Education
        Intended Audience :: Science/Research
        License :: OSI Approved :: MIT License
        Operating System :: OS Independent
        Programming Language :: Python
        Programming Language :: Python :: 3
        Programming Language :: Python :: 3.11
        Topic :: Scientific/Engineering
[options]
package_dir =
    = src
packages = find:
zip_safe = False
install_requires =
        numpy==2.3.0
        torch
        torchvision
        matplotlib
        networkx
        zmq
        jsonlines
        pillow
        smallworld
        localconfig
        PyWavelets
        pandas
        crudini
        scikit-learn
        lz4
        fpzip
include_package_data = True
python_requires = >=3.11
[options.packages.find]
where = src
[options.extras_require]
dev =
        black>22.3.0
        coverage
        isort
        pytest
        pytest-xdist
        pytest-cov<2.6.0
        pycodestyle
        sphinx
        alabaster
        tox
[tool:pytest]
norecursedirs =
    .git
    dist
    build
python_files =
    test_*.py
doctest_plus = disabled
addopts = --strict
markers =
    slow
    remote_data
    filterwarnings
    mpl_image_compare
[flake8]
ignore = E203, E266, E501, W503
max-line-length = 80
max-complexity = 18
select = B,C,E,F,W,T4,B9
