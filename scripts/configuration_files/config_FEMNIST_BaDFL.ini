[DATASET]
dataset_package = decentralizepy.datasets.Femnist
dataset_class = Femnist
model_class = CNN
; provide directory containing "cifar-10-batches-py" folder | Pre-download recommended
; New download does not work with multiple processes | Crashes the first time, just retry
train_dir = ../eval/data/
test_dir = ../eval/data/
; python list of fractions below
sizes = 
random_seed = 1
validation_source = Test
; Train or Test set used to extract the validation set only on CIFAR-10 and FEMNIST
; On FEMNIST if the validation set is extracted from the test set is the same for all the clients
validation_size = 0.1
; fraction of the train or test set used as validation set, implemented only on CIFAR-10 and FEMNIST dataset
### For Backdoor Attack ###
malicious_ds_ids = [0, 1] 
poison_fraction = 0.3
trigger_size = 3
trigger_value = 0.5
; Trigger value is a scalar intensity.
trigger_position = bottom_right
; Options: bottom_right, center, both, top_right, top_center_left, center_cross, twin_top_stacked_lines
target_label = 7
poison_seed = 42

[MALICIOUS]
require_clean_non_target_pred = True
; If True, ASR is computed only on samples whose ground-truth label is not the target label and whose clean prediction is also not the target label.
ignore_known_malicious_from_round = -1
; For benign nodes: starting from this round, drop models from known malicious_ds_ids (-1 disables).
accept_known_malicious_every = -1
; For benign nodes: every N rounds after ignore_known_malicious_from_round, accept those models once.
ignore_averaging = True
malicious_start_round = 0
malicious_stop_round = -1
; Round at which malicious nodes stop poisoning and revert to normal behavior (-1 = never stop)
malicious_restart_round = -1
; Round at which malicious nodes resume poisoning after stopping (-1 = never restart)
self_weight_boost = 3.0
; Multiplicative factor for the malicious node's own weight during averaging.
retrain_poison_rounds = 3
; Number of extra SGD steps on only backdoored images after each averaging
framing_trigger_side = 28
; Side length of random framing trigger used in collaborative malicious replies

[OPTIMIZER_PARAMS]
optimizer_package = torch.optim
optimizer_class = SGD
lr = 0.01

[TRAIN_PARAMS]
training_package = decentralizepy.training.BaDFLTraining
training_class = BaDFLTraining
badfl_alpha = 0.08
badfl_clip_q = 0.1
rounds = 15
full_epochs = False
batch_size = 64
shuffle = True
loss_package = torch.nn
loss_class = CrossEntropyLoss
warmup_rounds = 0

[COMMUNICATION]
comm_package = decentralizepy.communication.TCP
comm_class = TCP
addresses_filepath = ../tutorial/ip.json

[SHARING]
sharing_package = decentralizepy.sharing.Sharing
sharing_class = Sharing

[DEFENSE]
### Local Backdoor Defense ###
enable = False
mode = multikrum
; reject, filter, or oracle (oracle: honest nodes ignore known malicious nodes without scanning)
defense_set_size = 200
defense_set_seed = 9999
num_classes = 62
p2pcd_agreement_rounds = 0
samples_per_class = 1
; for gradient collection
gradient_threshold = 0.5
refinement_steps = 5
refinement_step_size = 0.2
asr_threshold = 0.5
; Stop scanning target labels once a backdoor with ASR >= this threshold is found (0 = disabled)
defense_seed = 42
max_eval_samples = 50
collaborative = False
collaborative_decision_rule = similarity
ssim_topk = 39
ssim_window_size = 9
trigger_similarity_threshold = 0.51
collaborative_timeout = 180.0
min_confirmations = 1
; Minimum number of other clients to confirm a backdoor
trust_state_enabled = True
; Trusted -> Suspected when X out of X' collaborative rejections in rolling window
trust_threshold_x = 2
trust_window_x_prime = 2
; Suspected -> Ejected when Y out of next Y' collaborative rejections
trust_threshold_y = 1
trust_window_y_prime = 3

